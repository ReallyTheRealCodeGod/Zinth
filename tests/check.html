<title>Zinth theory check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
(()=>{
'use strict';
/* ================= seeded random ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function randomSeed(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
class Rng{
  constructor(seed){this.f=mulberry32(hashStr(String(seed)))}
  next(){return this.f()} int(n){return Math.floor(this.f()*n)} pick(a){return a[this.int(a.length)]}
  chance(p){return this.f()<p} range(a,b){return a+this.f()*(b-a)}
  weighted(items,weights){let s=0;for(const w of weights)s+=w;let r=this.f()*s;for(let i=0;i<items.length;i++){r-=weights[i];if(r<=0)return items[i]}return items[items.length-1]}
}

/* ================= theory ================= */
const NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const ROMAN=['I','II','III','IV','V','VI','VII'];
const SCALES={
  major:     {name:'Major',            steps:[0,2,4,5,7,9,11], progs:[[0,4,5,3],[0,5,3,4],[5,3,0,4],[0,3,4,3],[0,3,5,4],[1,4,0,0],[0,2,5,3],[3,4,5,0]]},
  minor:     {name:'Natural minor',    steps:[0,2,3,5,7,8,10], progs:[[0,5,2,6],[0,6,5,6],[0,3,5,4],[0,5,3,4],[5,6,0,0],[0,2,6,5],[3,0,5,6],[0,5,0,6]]},
  dorian:    {name:'Dorian',           steps:[0,2,3,5,7,9,10], progs:[[0,3,0,3],[0,3,6,3],[0,1,3,0],[0,6,3,0],[0,3,1,0],[0,1,0,3]]},
  phrygian:  {name:'Phrygian',         steps:[0,1,3,5,7,8,10], progs:[[0,1,0,1],[0,1,5,1],[0,6,5,1],[0,2,1,0]]},
  lydian:    {name:'Lydian',           steps:[0,2,4,6,7,9,11], progs:[[0,1,0,1],[0,1,4,1],[0,4,1,0],[0,1,2,1]]},
  mixolydian:{name:'Mixolydian',       steps:[0,2,4,5,7,9,10], progs:[[0,6,3,0],[0,6,0,6],[0,3,6,0],[4,6,0,0],[0,4,6,3]]},
  harmMinor: {name:'Harmonic minor',   steps:[0,2,3,5,7,8,11], progs:[[0,3,4,0],[0,5,4,0],[0,4,0,4],[3,0,4,0],[0,5,3,4]]},
  pentMajor: {name:'Major pentatonic', steps:[0,2,4,7,9],      chord:'major'},
  pentMinor: {name:'Minor pentatonic', steps:[0,3,5,7,10],     chord:'minor'},
  blues:     {name:'Blues',            steps:[0,3,5,6,7,10],   chord:'minor', passing:[6]},
  hirajoshi: {name:'Hirajoshi',        steps:[0,2,3,7,8],      chord:'minor'},
  insen:     {name:'In-sen',           steps:[0,1,5,7,10],     chord:'phrygian'},
  wholeTone: {name:'Whole tone',       steps:[0,2,4,6,8,10],   progs:[[0,1,2,1],[0,2,4,2],[0,1,0,2]]},
};
const chordScaleOf=k=>SCALES[SCALES[k].chord||k];
function buildChord(steps,degree,size,rootMidi){
  const n=steps.length,out=[];
  for(let i=0;i<size;i++){
    let d=degree+2*i;
    if(i===3&&(d-degree)%n===0)d=degree+5; // six-note scales wrap the seventh onto the root: use the sixth instead
    out.push(rootMidi+12*Math.floor(d/n)+steps[d%n]);
  }
  return out;
}
function chordInfo(notes){
  const pcs=notes.map(m=>((m-notes[0])%12+12)%12);
  const third=pcs[1],fifth=pcs[2],sev=pcs[3];
  let q='',suffix='';
  if(third===4&&fifth===7){q='maj'}else if(third===3&&fifth===7){q='min';suffix='m'}
  else if(third===3&&fifth===6){q='dim';suffix='dim'}else if(third===4&&fifth===8){q='aug';suffix='+'}
  else{q='sus';suffix='sus'}
  if(sev!==undefined){ if(q==='maj'&&sev===11)suffix='maj7'; else if(q==='maj'&&sev===10)suffix='7'; else if(q==='min'&&sev===10)suffix='m7'; else suffix+='7'; }
  return {quality:q,name:NOTE_NAMES[((notes[0]%12)+12)%12]+suffix};
}
function romanFor(degree,quality,size){
  let r=ROMAN[degree]||String(degree+1);
  if(quality==='min'||quality==='dim')r=r.toLowerCase();
  if(quality==='dim')r+='°'; if(quality==='aug')r+='+'; if(size>3)r+='⁷';
  return r;
}

/* ================= generation ================= */
const STEPS=16,BARS=8,TOTAL=STEPS*BARS;
const DRUM_KINDS=['kick','snare','clap','hat','ohat'];

/* A progression entry is either a plain degree — what a chord-box sketch produces — or an object
   {d, bars, seventh, inv}: the degree, how many bars it lasts, whether it takes the seventh (else the
   track's own 7ths setting decides) and a fixed inversion (else voice leading picks one). Both forms
   live side by side in state.prog[part], so old projects and sketches keep working. */
function progEntry(x,n){
  const o=(x&&typeof x==='object')?x:{d:x};
  const d=Math.round(+o.d);if(!(d>=0&&d<n))return null;
  const e={d},b=Math.round(+o.bars),i=Math.round(+o.inv);
  if(b>=1&&b<=BARS)e.bars=b;
  if(o.seventh!==undefined&&o.seventh!==null)e.seventh=!!o.seventh;
  if(i>=0&&i<=3)e.inv=i;
  return e;
}
function normProg(prog,n){
  if(!Array.isArray(prog))return null;
  const out=prog.map(x=>progEntry(x,n)).filter(Boolean).slice(0,BARS);
  return out.length?out:null;
}
// Give every chord its span: a chord that sets its own length keeps it, the rest share what is left, and
// the last chord stretches or is clipped so the progression always covers exactly the 8 bars of the loop.
function layoutProg(list){
  const fixed=list.reduce((a,e)=>a+(e.bars||0),0),autos=list.filter(e=>!e.bars).length;
  const room=Math.max(0,BARS-fixed),base=autos?Math.floor(room/autos):0,extra=autos?room-base*autos:0;
  const out=[];let bar=0,ai=0;
  for(const e of list){
    if(bar>=BARS)break;
    const want=e.bars||(base+(ai++<extra?1:0));
    const bars=Math.min(want,BARS-bar);
    if(bars<1)continue;
    out.push({e,bar0:bar,bars});bar+=bars;
  }
  if(!out.length){out.push({e:list[0],bar0:0,bars:BARS});bar=BARS}
  if(bar<BARS)out[out.length-1].bars+=BARS-bar;
  return out;
}
// a track code carries a progression as "0x4-3x2i1": degree, "x" bars, "7" or "3" for a forced
// seventh or triad, "i" for a fixed inversion. A plain "0-3-4-0" is still a valid progression.
function progCode(list){
  if(!Array.isArray(list)||!list.length)return '';
  return list.map(x=>{
    const e=(x&&typeof x==='object')?x:{d:x};let s=String(Math.max(0,Math.round(+e.d)||0));
    if(e.bars)s+='x'+e.bars;
    if(e.seventh===true)s+='7';else if(e.seventh===false)s+='3';
    if(e.inv!==undefined&&e.inv!==null)s+='i'+e.inv;
    return s;
  }).join('-');
}
function parseProgCode(str){
  const tok=/^(\d+)(?:x(\d))?(7|3)?(?:i(\d))?$/;
  if(!/^\d+(x\d)?(7|3)?(i\d)?(-\d+(x\d)?(7|3)?(i\d)?)*$/.test(str||''))return null;
  return String(str).split('-').slice(0,BARS).map(t=>{
    const m=tok.exec(t),e={d:+m[1]};
    if(m[2])e.bars=+m[2];
    if(m[3])e.seventh=m[3]==='7';
    if(m[4]!==undefined)e.inv=+m[4];
    return e;
  });
}
function generateChords(cfg,rng){
  const cs=chordScaleOf(cfg.scale);
  const list=normProg(cfg.prog,cs.steps.length)||rng.pick(cs.progs).map(d=>({d}));
  const rootMidi=(cfg.root>=6?48:60)+cfg.root;
  let prev=null;
  return layoutProg(list).map(({e,bar0,bars})=>{
    const size=(e.seventh===undefined?cfg.sevenths:e.seventh)?4:3;
    const base=buildChord(cs.steps,e.d,size,rootMidi);
    const info=chordInfo(base);
    const rootPc=base[0]%12,fifthPc=base[2]%12;
    let notes=base;
    // voice leading: least movement from the previous voicing, near the home register. A chord that names
    // its own inversion only chooses the octave, so the note you asked for stays in the bass.
    const invs=e.inv===undefined?base.map((_,k)=>k):[Math.min(e.inv,size-1)];
    if(prev||e.inv!==undefined){
      let best=null,bd=1e9;
      for(const inv of invs)for(const oct of [-12,0]){
        const v=base.map((m,k)=>(k<inv?m+12:m)+oct).sort((a,b)=>a-b);
        if(new Set(v).size!==v.length)continue;
        const mean=v.reduce((a,b)=>a+b,0)/v.length;
        let d=0;if(prev)v.forEach((m,k)=>{d+=Math.abs(m-prev[Math.min(k,prev.length-1)])});
        d+=Math.max(0,Math.abs(mean-(rootMidi+6))-6)*2;
        if(d<bd){bd=d;best=v}
      }
      if(best)notes=best;
    }
    prev=notes;
    const inv=Math.max(0,base.map(m=>((m%12)+12)%12).indexOf(((notes[0]%12)+12)%12));
    return {degree:e.d,notes,rootPc,fifthPc,seventh:size>3,inv,
      name:info.name+(inv?'/'+NOTE_NAMES[((notes[0]%12)+12)%12]:''),
      roman:romanFor(e.d,info.quality,size),bar0,bars,pcs:new Set(notes.map(m=>m%12))};
  });
}
const chordAt=(chords,step)=>{const bar=Math.floor(step/STEPS);for(const c of chords)if(bar<c.bar0+c.bars)return c;return chords[chords.length-1]};

function scalePitches(cfg,lo,hi){
  const sc=SCALES[cfg.scale],out=[];
  for(let m=lo;m<=hi;m++){const rel=((m-cfg.root)%12+12)%12;const k=sc.steps.indexOf(rel);if(k>=0)out.push({midi:m,passing:!!(sc.passing&&sc.passing.includes(rel))})}
  return out;
}
function rhythmMotif(rng,density,gate){
  const on=[];let last=-99;
  for(let s=0;s<STEPS*2;s++){
    const pos=s%16;
    let p=pos%4===0?0.55+density*0.4 : pos%2===0?0.15+density*0.45 : density*0.35;
    if(s-last<2)p*=0.15;
    if(rng.chance(p)){on.push(s);last=s}
  }
  if(on.length===0)on.push(0);
  if(on[0]!==0&&rng.chance(0.7))on.unshift(0);
  return on.map((s,i)=>{const next=on[i+1]!==undefined?on[i+1]:STEPS*2;const room=next-s;return {s,d:Math.max(1,Math.min(room,Math.round(room*gate)||1))}});
}
function makeContour(rng,len,leap){
  const c=[];for(let i=0;i<len;i++){const r=rng.next();c.push(r<0.30?0:r<0.62?1:r<0.86?-1:rng.chance(leap)?rng.pick([2,3,-2,-3,4,-4]):rng.pick([2,-2]))}return c;
}
function realise(rng,motif,contour,chords,pitches,startStep,resolve){
  const evs=[];const isCT=(p,ch)=>ch.pcs.has(p.midi%12);
  let ch=chordAt(chords,startStep);
  const ctIdx=pitches.map((p,i)=>i).filter(i=>isCT(pitches[i],ch)&&!pitches[i].passing);
  const mid=pitches.length/2;
  let idx=ctIdx.length?ctIdx.reduce((a,b)=>Math.abs(b-mid)<Math.abs(a-mid)?b:a):Math.floor(mid);
  motif.forEach((n,i)=>{
    const step=startStep+n.s;ch=chordAt(chords,step);
    if(i>0){idx+=contour[i%contour.length];
      if(idx<0)idx=1+rng.int(2); if(idx>=pitches.length)idx=pitches.length-2-rng.int(2);
      idx=Math.max(0,Math.min(pitches.length-1,idx));
    }
    const strong=(n.s%4===0);
    if(strong||pitches[idx].passing){
      let best=idx,bd=99;
      for(let k=Math.max(0,idx-2);k<=Math.min(pitches.length-1,idx+2);k++){
        if(isCT(pitches[k],ch)&&!pitches[k].passing){const d=Math.abs(k-idx);if(d<bd){bd=d;best=k}}
      }
      if(strong?(bd<99&&rng.chance(0.8)):true)idx=best;
      if(pitches[idx].passing)idx=Math.max(0,idx-1);
    }
    evs.push({step,dur:n.d,midi:pitches[idx].midi,vel:strong?0.9:0.7+rng.next()*0.15});
  });
  if(resolve&&evs.length){
    const last=evs[evs.length-1];const ch2=chordAt(chords,last.step);
    const targets=pitches.filter(p=>(p.midi%12)===ch2.rootPc||(p.midi%12)===ch2.fifthPc);
    if(targets.length){last.midi=targets.reduce((a,b)=>Math.abs(b.midi-last.midi)<Math.abs(a.midi-last.midi)?b:a).midi;}
    last.dur=Math.max(last.dur,4);last.vel=0.95;
  }
  return evs;
}
function generateLead(cfg,chords,rngA,rngB){
  const energy=cfg.energy/100;
  const lo=64+(cfg.root>=6?-6:0),pitches=scalePitches(cfg,lo,lo+22);
  const density=0.25+energy*0.55,gate=cfg.gate;
  const A=rhythmMotif(rngA,density,gate),cA=makeContour(rngA,cfg.hook?3+rngA.int(3):A.length,0.35+energy*0.3);
  const B=rhythmMotif(rngB,density*(0.8+rngB.next()*0.5),gate),cB=makeContour(rngB,B.length,0.5);
  return [
    ...realise(rngA,A,cA,chords,pitches,0,false),
    ...realise(rngA,A,cA,chords,pitches,32,rngA.chance(0.5)),
    ...realise(rngB,B,cB,chords,pitches,64,false),
    ...realise(rngA,A,cA,chords,pitches,96,true),
  ];
}
function generateArp(cfg,chords,rng){
  const energy=cfg.energy/100;
  const mode=rng.pick(['up','up','down','updown','random']);
  const rate=energy>0.62?1:2,wide=rng.chance(0.5),rest=energy<0.35?rng.pick([0,4]):0;
  const out=[];let k=0;
  for(let s=0;s<TOTAL;s+=rate){
    const ch=chordAt(chords,s);
    let notes=ch.notes.map(m=>m+12);if(wide)notes=notes.concat(ch.notes.map(m=>m+24));
    if(rest&&(k%rest)===rest-1){k++;continue}
    let i;const L=notes.length;
    if(mode==='up')i=k%L;else if(mode==='down')i=L-1-(k%L);
    else if(mode==='updown'){const c=2*L-2;const j=k%c;i=j<L?j:c-j}
    else i=rng.int(L);
    out.push({step:s,dur:Math.max(1,Math.round(rate*0.7)),midi:notes[i],vel:(s%4===0?0.8:0.55)+rng.next()*0.1});
    k++;
  }
  return out;
}
// the bass always sounds in its own register; an edited note is folded by octaves, so its pitch class stays
const BASS_LO=36,BASS_HI=59;
function bassRegister(m){while(m<BASS_LO)m+=12;while(m>BASS_HI)m-=12;return m}
// the arp sings above the chords: this is the window its generator writes in and its roll lane draws
const arpRange=root=>{const lo=(root>=6?48:60)+root;return [lo+7,lo+41]};
// where a letter key lands when you record it into a layer: the lead as played, the arp an octave up,
// the bass folded into its own register. The pitch class never changes, so the key stays locked.
function recordPitch(L,midi,root){
  if(L==='bass')return bassRegister(midi);
  if(L!=='arp')return midi;
  const r=arpRange(root);let m=midi+12;
  while(m>r[1])m-=12;while(m<r[0])m+=12;return m;
}
function generateBass(cfg,chords,rng){
  const energy=cfg.energy/100;
  const pattern=rng.weighted(['roots','pulse','octave','synco','walk'],[1.2-energy,0.4+energy,0.3+energy,0.5+energy*0.6,0.6]);
  const out=[];
  for(let bar=0;bar<BARS;bar++){
    const s0=bar*STEPS,ch=chordAt(chords,s0);
    const root=36+ch.rootPc,fifth=36+ch.fifthPc;
    const add=(o,d,m,v)=>out.push({step:s0+o,dur:d,midi:m,vel:v});
    if(pattern==='roots'){add(0,8,root,0.9);add(8,6,root,0.75);if(rng.chance(0.4))add(14,2,fifth,0.6)}
    else if(pattern==='pulse'){for(let o=0;o<16;o+=2)add(o,1,root,o%4===0?0.9:0.65)}
    else if(pattern==='octave'){for(let o=0;o<16;o+=2)add(o,1,o%4===0?root:root+12,o%4===0?0.9:0.6)}
    else if(pattern==='synco'){add(0,3,root,0.95);add(3,3,root,0.7);add(6,2,root,0.75);add(10,2,fifth,0.7);add(12,2,root,0.8);if(rng.chance(0.5))add(14,2,root+12,0.6)}
    else {add(0,4,root,0.9);add(4,4,root,0.7);add(8,4,fifth,0.8);add(12,4,bar%2?root:fifth,0.7)}
  }
  return out;
}
// one bar of drums as velocity rows; this is what the step grid edits
function generateDrumPattern(cfg,rng){
  const energy=cfg.energy/100,P={};DRUM_KINDS.forEach(k=>P[k]=new Array(16).fill(0));P.fill=true;
  const kick=rng.weighted([[0,4,8,12],[0,7,10],[0,10],[0,6,10,12],[0,3,8,11]],[energy*1.5,0.8,1-energy,0.5+energy*0.4,0.6]);
  kick.forEach(o=>P.kick[o]=o===0?1:0.85);
  if(energy>0.5&&rng.chance(0.5))P.kick[rng.pick([6,11,15])]=0.55;
  const snare=kick.length<=2&&rng.chance(0.6)?[8]:[4,12];
  snare.forEach(o=>P.snare[o]=0.9);
  if(rng.chance(energy>0.5?0.55:0.25))snare.forEach(o=>P.clap[o]=0.7);
  const hatRate=energy>0.7?1:energy>0.3?2:4,openAt=rng.chance(0.5)?14:-1;
  for(let o=0;o<16;o+=hatRate)P.hat[o]=o%4===0?0.7:o%2===0?0.5:0.35;
  if(openAt>=0){P.hat[openAt]=0;P.ohat[openAt]=0.7}
  return P;
}
function expandDrums(P,bars){
  const out=[];
  for(let bar=0;bar<bars;bar++){
    const s0=bar*STEPS,fill=P.fill&&bar===bars-1;
    for(const k of DRUM_KINDS)for(let o=0;o<16;o++){const v=P[k][o];if(!v)continue;if(fill&&o>=12&&(k==='hat'||k==='ohat'))continue;out.push({step:s0+o,kind:k,vel:v})}
    if(fill)[12,13,14,15].forEach((o,i)=>out.push({step:s0+o,kind:'snare',vel:0.5+i*0.15}));
  }
  return out;
}
/* A section can sweep the whole mix through a master low-pass. The plan is a list of {t,hz,ramp}
   points in seconds from the section's first step: 'up' opens from SWEEP.lo over the whole section,
   'down' holds the mix open and closes it over the last bar. Playback and the WAV export apply the
   same plan, so an export sounds like what you heard. */
const SWEEP={lo:300,open:18000},SWEEP_MODES=['none','up','down'];
function sweepPlan(mode,steps,stepSec){
  if((mode!=='up'&&mode!=='down')||!(steps>0)||!(stepSec>0))return null;
  const len=steps*stepSec,fall=Math.min(STEPS*stepSec,len);
  if(mode==='up')return [{t:0,hz:SWEEP.lo,ramp:false},{t:len,hz:SWEEP.open,ramp:true}];
  const pts=[{t:0,hz:SWEEP.open,ramp:false}];
  if(len>fall)pts.push({t:len-fall,hz:SWEEP.open,ramp:false});
  pts.push({t:len,hz:SWEEP.lo,ramp:true});
  return pts;
}
/* A section can also fade. 'in' rises from silence to full over its first two bars, 'out' plays full and
   falls to silence over its last two bars; a section shorter than that fades over its whole length. The
   plan is a list of {t,g,ramp} points in seconds from the section's first step, applied by a master gain
   after the limiter. Playback, the WAV export and the MIDI volume automation all read the same plan. */
// A gain ramp is exponential, so it moves at a steady number of decibels a second — and a single ramp all
// the way from silence would spend half a fade below hearing. The knee splits it: the quiet end is crossed
// quickly and most of the fade happens in the range you can actually hear, the way a hand on a fader moves.
const FADE={lo:0.0008,full:1,knee:0.08,kneeAt:0.35,bars:2},FADE_MODES=['none','in','out'];
function fadePlan(mode,steps,stepSec){
  if((mode!=='in'&&mode!=='out')||!(steps>0)||!(stepSec>0))return null;
  const len=steps*stepSec,span=Math.min(FADE.bars*STEPS*stepSec,len),knee=span*FADE.kneeAt;
  if(mode==='in')return [{t:0,g:FADE.lo,ramp:false},{t:knee,g:FADE.knee,ramp:true},{t:span,g:FADE.full,ramp:true}];
  const pts=[{t:0,g:FADE.full,ramp:false}];
  if(len>span)pts.push({t:len-span,g:FADE.full,ramp:false});
  pts.push({t:len-knee,g:FADE.knee,ramp:true},{t:len,g:FADE.lo,ramp:true});
  return pts;
}
/* Analog drift. A real analog synth never plays the same note twice: its oscillators wander a few cents

    assert(t1.chords.length===1&&t1.chords[0].degree===n-1,'a single edited chord did not fill the loop'+tag);
    // a progression survives the round trip through a track code, modifiers and all
    const codeStr=Z.progCode(wanted),back=Z.parseProgCode(codeStr);
    assert(JSON.stringify(back)===JSON.stringify(wanted),'a progression did not survive its track code: '+codeStr+tag);
    assert(JSON.stringify(Z.parseProgCode(Z.progCode(sketch)))===JSON.stringify(sketch.map(d=>({d}))),'a sketched progression did not survive its track code'+tag);
  }
}

// per-section filter sweeps: the plan playback and the WAV export both follow. A sweep must start and
// end on a real, audible frequency, never run past the section it belongs to, and always hand the next
// section a wide-open mix — so a sweep can shape a song but can never silence one.
for(const bars of [1,2,4,8,16]){
  for(const bpm of [60,92,138,180]){
    const stepSec=60/bpm/4,steps=bars*Z.STEPS,len=steps*stepSec;
    const tag=' [sweep · '+bars+' bars · '+bpm+' bpm]';
    ['none',undefined,null,'','sideways'].forEach(m=>assert(Z.sweepPlan(m,steps,stepSec)===null,'sweep mode '+m+' should mean no sweep at all'+tag));
    ['up','down'].forEach(mode=>{
      const plan=Z.sweepPlan(mode,steps,stepSec),what=' ('+mode+')'+tag;
      assert(Array.isArray(plan)&&plan.length>=2,'sweep plan missing'+what);
      if(!Array.isArray(plan))return;
      let prev=-1;
      plan.forEach(p=>{
        assert(p.t>=0&&p.t<=len+1e-9,'sweep point at '+p.t+' s outside the section'+what);
        assert(p.t>=prev-1e-9,'sweep points out of order'+what);prev=p.t;
        assert(p.hz>=Z.SWEEP.lo&&p.hz<=Z.SWEEP.open,'sweep frequency '+p.hz+' Hz outside '+Z.SWEEP.lo+'–'+Z.SWEEP.open+what);
        assert(p.hz>0,'a sweep frequency of 0 Hz would silence the mix'+what); // exponential ramps need a positive target
      });
      assert(plan[0].t===0&&plan[0].ramp===false,'a sweep must set its starting value on the first step'+what);
      assert(Math.abs(plan[plan.length-1].t-len)<1e-9,'a sweep must land exactly at the end of its section'+what);
      if(mode==='up'){
        assert(plan[0].hz===Z.SWEEP.lo,'an up sweep must start dark'+what);
        assert(plan[plan.length-1].hz===Z.SWEEP.open,'an up sweep must end wide open'+what);
      }else{
        assert(plan[0].hz===Z.SWEEP.open,'a down sweep must start wide open'+what);
        assert(plan[plan.length-1].hz===Z.SWEEP.lo,'a down sweep must end closed'+what);
        // it closes over the last bar and not a step before, so the section plays open until then
        const fall=Math.min(Z.STEPS*stepSec,len),hold=plan[plan.length-2];
        assert(Math.abs(hold.t-(len-fall))<1e-9,'a down sweep starts closing at '+hold.t+' s, expected '+(len-fall)+what);
        assert(hold.hz===Z.SWEEP.open,'a down sweep must still be open when it starts closing'+what);
      }
    });
  }
}

// per-section fades: the plan playback, the WAV export and the MIDI volume automation all follow. A fade
// must move between silence and full level and nothing else, stay inside its own section, never reach a
// gain of 0 (an exponential ramp cannot land there), and always leave a section that does not fade — and
// every section after a fade-in — at full level, so a fade can shape a song but can never mute one.
for(const bars of [1,2,4,8,16]){
  for(const bpm of [60,92,138,180]){
    const stepSec=60/bpm/4,steps=bars*Z.STEPS,len=steps*stepSec;
    const span=Math.min(Z.FADE.bars*Z.STEPS*stepSec,len),tag=' [fade · '+bars+' bars · '+bpm+' bpm]';
    ['none',undefined,null,'','sideways','up'].forEach(m=>assert(Z.fadePlan(m,steps,stepSec)===null,'fade mode '+m+' should mean no fade at all'+tag));
    assert(Z.fadeGain(null,0)===Z.FADE.full&&Z.fadeGain(null,len)===Z.FADE.full,'a section that does not fade must play at full level'+tag);
    ['in','out'].forEach(mode=>{
      const plan=Z.fadePlan(mode,steps,stepSec),what=' ('+mode+')'+tag;
      assert(Array.isArray(plan)&&plan.length>=2,'fade plan missing'+what);
      if(!Array.isArray(plan))return;
      let prev=-1;
      plan.forEach(p=>{
        assert(p.t>=0&&p.t<=len+1e-9,'fade point at '+p.t+' s outside the section'+what);
        assert(p.t>=prev-1e-9,'fade points out of order'+what);prev=p.t;
        assert(p.g>=Z.FADE.lo&&p.g<=Z.FADE.full,'fade gain '+p.g+' outside '+Z.FADE.lo+'–'+Z.FADE.full+what);
        assert(p.g>0,'a fade gain of 0 would break the exponential ramp'+what);
      });
      assert(plan[0].t===0&&plan[0].ramp===false,'a fade must set its starting value on the first step'+what);
      // the curve the engine hears and the MIDI export samples: it starts and ends where the plan says
      assert(Math.abs(Z.fadeGain(plan,0)-plan[0].g)<1e-12,'the fade curve does not start where the plan does'+what);
      assert(Math.abs(Z.fadeGain(plan,len)-plan[plan.length-1].g)<1e-12,'the fade curve does not end where the plan does'+what);
      assert(Z.fadeGain(plan,-1)===plan[0].g,'the fade curve must hold its first value before the section'+what);
      let last=-1;
      for(let i=0;i<=40;i++){
        const g=Z.fadeGain(plan,len*i/40);
        assert(g>0&&g<=Z.FADE.full+1e-12,'fade gain '+g+' outside (0, 1]'+what);
        const rising=mode==='in'?g>=last-1e-12:g<=(last<0?Z.FADE.full:last)+1e-12;
        assert(rising,'a fade '+mode+' is not moving in one direction at '+(i/40)+' of the section'+what);
        last=g;
      }
      // a fade you can hear: halfway through its two bars it sits in the audible range, not already gone
      const mid=Z.fadeGain(plan,mode==='in'?span/2:len-span/2);
      assert(mid>0.03&&mid<Z.FADE.full,'halfway through, a fade '+mode+' is at '+mid+', not in the range you can hear'+what);
      if(mode==='in'){
        assert(plan[0].g===Z.FADE.lo,'a fade in must start from silence'+what);
        assert(plan[plan.length-1].g===Z.FADE.full,'a fade in must reach full level'+what);
        assert(Math.abs(plan[plan.length-1].t-span)<1e-9,'a fade in must be up at '+span+' s, the end of its second bar'+what);
        assert(Z.fadeGain(plan,span)===Z.FADE.full,'a fade in must be at full level once it is up'+what);
        assert(Z.fadeGain(plan,len)===Z.FADE.full,'a fade in must hand the next section a full mix'+what);
      }else{
        assert(plan[0].g===Z.FADE.full,'a fade out must start at full level'+what);
        assert(plan[plan.length-1].g===Z.FADE.lo,'a fade out must end in silence'+what);
        assert(Math.abs(plan[plan.length-1].t-len)<1e-9,'a fade out must land exactly at the end of its section'+what);
        // it falls over the last two bars and not a step before, so the section plays full until then
        assert(Z.fadeGain(plan,Math.max(0,len-span-1e-6))===Z.FADE.full,'a fade out must still be at full level when it starts falling'+what);
      }
    });
  }
}

// analog drift: every synth voice wanders a few cents in pitch and a little in filter cutoff, so no two
// notes are identical. The scale lock says how far it may go: a drifted note must still round to exactly
// the note that was asked for, in every key, at every setting of the knob — including one set past its own
// range. And the filter multiplier must stay a positive number, or a drifted note would be lost entirely.
{
  const rs=[0,0.001,0.17,0.5,0.83,1],amounts=[0,1,12,28,50,75,100];
  // an amount past either end of the knob is clamped to it; anything that is not a number at all means no drift
  const bad=[-40,140,NaN,undefined,null,'x'],none=[-40,NaN,undefined,null,'x'];
  assert(Z.DRIFT.cents>0&&Z.DRIFT.cents<50,'drift of '+Z.DRIFT.cents+' cents could reach the next semitone');
  assert(Z.DRIFT.cutoff>0&&Z.DRIFT.cutoff<1,'a filter drift of '+Z.DRIFT.cutoff+' could close a voice completely');
  assert(Z.DRIFT.seconds>0,'drift must wander over a real span of time');
  for(const r of rs){
    assert(Z.driftCents(0,r)===0,'drift at 0 must leave a note perfectly still (r='+r+')');
    assert(Z.driftCutoff(0,r)===1,'drift at 0 must leave the filter cutoff alone (r='+r+')');
    for(const a of amounts.concat(bad)){
      const c=Z.driftCents(a,r),k=Z.driftCutoff(a,r),tag=' [drift '+a+' · r='+r+']';
      assert(Math.abs(c)<=Z.DRIFT.cents+1e-12,'drift of '+c+' cents is past the '+Z.DRIFT.cents+' the knob allows'+tag);
      assert(Math.abs(c)<50,'drift of '+c+' cents would change the note itself'+tag);
      assert(k>0,'a filter drift multiplier of '+k+' would silence the voice'+tag);
      assert(Math.abs(k-1)<=Z.DRIFT.cutoff+1e-12,'filter drift '+k+' is past the range the knob allows'+tag);
    }
    // an amount that is not a number, or one below the knob, is read as no drift at all
    for(const a of none)assert(Z.driftCents(a,r)===0&&Z.driftCutoff(a,r)===1,'a drift amount of '+a+' should mean no drift');
    // and one past the top of the knob is read as the top of the knob, never as something wilder
    assert(Z.driftCents(140,r)===Z.driftCents(100,r)&&Z.driftCutoff(140,r)===Z.driftCutoff(100,r),'a drift amount past 100 should clamp to 100 (r='+r+')');
  }
  // the knob's ends and its centre: fully flat, fully sharp, and dead in tune
  assert(Z.driftCents(100,0)===-Z.DRIFT.cents&&Z.driftCents(100,1)===Z.DRIFT.cents,'the drift knob does not reach its own limits');
  assert(Z.driftCents(100,0.5)===0&&Z.driftCutoff(100,0.5)===1,'the middle of the drift range must be dead in tune');
  assert(Z.driftCents(50,1)===Z.DRIFT.cents/2,'the drift amount does not scale evenly');
  // an r outside [0,1] is clamped, so a stray random value can never push a note out of key
  assert(Z.driftCents(100,9)===Z.DRIFT.cents&&Z.driftCents(100,-9)===-Z.DRIFT.cents,'drift must clamp a random value outside 0–1');
  // the scale lock itself: a drifted note still rounds to the note that was played, in every key and scale
  for(const scale in Z.SCALES){
    for(let root=0;root<12;root++){
      const tag=' [drift · '+Z.NOTE_NAMES[root]+' '+Z.SCALES[scale].name+']';
      for(const p of Z.scalePitches({root,scale},Z.BASS_LO,96)){
        for(const r of rs){
          const heard=p.midi+Z.driftCents(100,r)/100;
          assert(Math.round(heard)===p.midi,'a drifted note sounds as '+heard+', not the '+p.midi+' that was played'+tag);
          assert(((Math.round(heard)%12)+12)%12===((p.midi%12)+12)%12,'a drifted note lost its pitch class'+tag);
        }
      }
    }
  }
}

// chorus: a delay line that moves bends the pitch of whatever runs through it, so the stereo chorus every
// synth layer can send into is held to the same rule as analog drift — it may widen a note, never change it.
// Its delay lines must also stay inside the buffer they were given and never ask for a negative delay time.
{
  const V=Z.CHORUS.voices;
  assert(Array.isArray(V)&&V.length>=2,'a stereo chorus needs at least two voices');
  assert(Z.CHORUS.mix>0&&Z.CHORUS.mix<=1,'the chorus return of '+Z.CHORUS.mix+' is not a usable mix level');
  assert(Z.CHORUS.maxCents>0&&Z.CHORUS.maxCents<50,'a chorus allowed '+Z.CHORUS.maxCents+' cents could change the note');
  V.forEach((v,i)=>{
    const tag=' [chorus voice '+(i+1)+']';
    assert(v.delay-v.depth>0,'a chorus voice would ask for a negative delay time'+tag);
    assert(v.delay+v.depth<Z.CHORUS.maxDelay,'a chorus voice would run past its own delay buffer'+tag);
    assert(v.delay>=0.005&&v.delay<=0.04,'a delay of '+v.delay+' s is an echo or a comb, not a chorus'+tag);
    assert(v.rate>0.05&&v.rate<2,'a chorus rate of '+v.rate+' Hz is not the slow drift a chorus wants'+tag);
    assert(v.depth>0,'a chorus voice that does not move is just a delay'+tag);
    assert(v.pan>=-1&&v.pan<=1,'a chorus voice is panned outside the stereo field'+tag);
    const cents=Z.chorusCents(v);
    assert(cents>0,'a chorus voice must move the pitch a little, or it adds nothing'+tag);
    assert(cents<=Z.CHORUS.maxCents,'a chorus voice bends a note by '+cents+' cents, past the '+Z.CHORUS.maxCents+' allowed'+tag);
    assert(cents<50,'a chorus voice bends a note by '+cents+' cents, far enough to change the note'+tag);
    // the scale lock: a chorused note still rounds to the note that was played, in every key and scale
    for(const dir of [-1,1])for(const m of [Z.BASS_LO,60,72,96])
      assert(Math.round(m+dir*cents/100)===m,'a chorused note sounds as '+(m+dir*cents/100)+', not the '+m+' that was played'+tag);
  });
  assert(V.some(v=>v.pan<0)&&V.some(v=>v.pan>0),'a stereo chorus must reach both sides of the field');
  assert(new Set(V.map(v=>v.rate)).size===V.length,'chorus voices sharing one rate would move as one');
}

// warmth: the master soft clip and its high shelf. It may colour a mix and lift its quiet half, but it must
// never push the signal past full scale, never invert it, never boost the top end, and at 0 it must be a
// true bypass — one knob you can leave anywhere without the mix falling apart.
{
  const amounts=[0,1,12,22,50,75,100],bad=[-40,140,NaN,undefined,null,'x'],none=[-40,NaN,undefined,null,'x'];
  assert(Z.WARMTH.drive>0,'warmth with no drive would do nothing at all');
  assert(Z.WARMTH.shelfDb<0,'the warmth shelf must roll the top end off, not boost it');
  assert(Z.WARMTH.shelfHz>1000&&Z.WARMTH.shelfHz<12000,'a shelf at '+Z.WARMTH.shelfHz+' Hz is not the top end');
  assert(Z.WARMTH.trim>0&&Z.WARMTH.trim<1,'the warmth trim must take a little level, not all of it');
  assert(Z.WARMTH.dflt>=0&&Z.WARMTH.dflt<=100,'the default warmth is not on the knob');
  assert(Z.warmthCurve(0)===null,'warmth at 0 must leave the mix untouched');
  assert(Z.warmthShelf(0)===0&&Z.warmthTrim(0)===1,'warmth at 0 must leave the tone and the level alone');
  for(const a of none)assert(Z.warmthCurve(a)===null&&Z.warmthShelf(a)===0&&Z.warmthTrim(a)===1,'a warmth of '+a+' should mean no warmth at all');
  assert(Z.warmthAmt(140)===1&&Z.warmthAmt(-3)===0,'warmth past either end of the knob should clamp to it');
  for(const a of amounts.concat(bad)){
    const tag=' [warmth '+a+']',sh=Z.warmthShelf(a),tr=Z.warmthTrim(a);
    assert(sh<=0&&sh>=Z.WARMTH.shelfDb-1e-12,'a warmth shelf of '+sh+' dB is outside 0 to '+Z.WARMTH.shelfDb+tag);
    assert(tr>0&&tr<=1,'a warmth trim of '+tr+' is outside (0, 1]'+tag);
    assert(Math.abs(Z.warmthShape(0,a))<1e-12,'warmth must leave silence silent'+tag);
    assert(Math.abs(Z.warmthShape(1,a)-1)<1e-12&&Math.abs(Z.warmthShape(-1,a)+1)<1e-12,'warmth must map full scale to full scale, so it can never clip harder than the mix already does'+tag);
    let last=-2;
    for(let i=0;i<=64;i++){
      const x=i/64*2-1,y=Z.warmthShape(x,a);
      assert(y>=-1-1e-12&&y<=1+1e-12,'warmth pushed '+x+' to '+y+', past full scale'+tag);
      assert(y>=last-1e-12,'the warmth curve turns back on itself at '+x+', which would fold the waveform'+tag);
      last=y;
      assert(Math.abs(y+Z.warmthShape(-x,a))<1e-12,'the warmth curve is not odd-symmetric, so it would shift the waveform off centre'+tag);
      if(x>0)assert(y>=x-1e-12,'warmth at '+x+' came back quieter as '+y+', so it is not lifting the quiet half'+tag);
    }
    // an input past full scale is held there, the way the waveshaper itself holds the ends of its curve
    assert(Z.warmthShape(4,a)===Z.warmthShape(1,a)&&Z.warmthShape(-4,a)===Z.warmthShape(-1,a),'warmth must hold its ends outside ±1'+tag);
  }
  // the curve handed to the waveshaper is the same function, sampled: ends at ±1, rising all the way
  const c=Z.warmthCurve(100);
  assert(c&&c.length===Z.WARMTH.points,'the warmth curve is not the size it says it is');
  assert(Math.abs(c[0]+1)<1e-6&&Math.abs(c[c.length-1]-1)<1e-6,'the warmth curve does not span full scale');
  for(let i=1;i<c.length;i++)assert(c[i]>=c[i-1]-1e-12,'the warmth curve is not monotonic at sample '+i);
  assert(Z.warmthShape(0.25,100)>Z.warmthShape(0.25,25),'more warmth must mean more drive');
  assert(Z.warmthShelf(100)<Z.warmthShelf(25),'more warmth must roll more of the top end off');
}

// chord box voicings: every diatonic chord of every scale, in every key, is entirely in scale
for(const scale in Z.SCALES){const cs=Z.chordScaleOf(scale);for(let root=0;root<12;root++){const chPcs=pcsOf(root,cs.steps);
  cs.steps.forEach((_,d)=>[3,4].forEach(size=>Z.buildChord(cs.steps,d,size,60+root).forEach(m=>assert(chPcs.has(((m%12)+12)%12),'pad chord degree '+(d+1)+' outside '+Z.NOTE_NAMES[root]+' '+cs.name))))}}

const ms=Math.round(performance.now()-t0);
window.ZINTH_CHECK={fails,tracks,ms,results};
function report(){
document.body.style.cssText='margin:0;padding:32px;background:#13151d;color:#ece6d8;font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif';
const h=document.createElement('div');
h.innerHTML='<h1 style="font:700 26px \'Chakra Petch\',sans-serif;letter-spacing:.12em;margin:0 0 6px">ZIN<span style="color:#f5a524">TH</span> theory check</h1>'+
  '<p style="color:#a3a8bf;margin:0 0 18px">'+tracks+' generated tracks across '+Object.keys(Z.SCALES).length+' scales, 4 keys, '+seeds.length+' seeds and both song parts, plus every chord-box voicing in all 12 keys. '+ms+' ms.</p>'+
  '<div style="display:inline-block;padding:10px 16px;border-radius:6px;font:600 15px \'Chakra Petch\',sans-serif;letter-spacing:.1em;background:'+(fails?'rgba(242,109,133,.15);color:#f26d85;border:1px solid #f26d85':'rgba(79,209,197,.15);color:#4fd1c5;border:1px solid #4fd1c5')+'">'+(fails?fails+' FAILURES':'ALL CHECKS PASS')+'</div>'+
  (fails?'<ul style="font:13px \'IBM Plex Mono\',monospace;color:#f26d85;line-height:1.7">'+results.slice(0,200).map(r=>'<li>'+r+'</li>').join('')+'</ul>':'')+
  '<ul style="color:#a3a8bf;margin-top:20px;line-height:1.8"><li>Every chord tone, arp note and bass note is diatonic to the chord scale.</li><li>Every melody note is in the melody scale; blues passing tones never land on a downbeat.</li><li>At least 60 % of melody downbeats are chord tones of the chord sounding at that moment.</li><li>Arps only use tones of the chord that is playing.</li><li>Generation is deterministic, so a chorus hook returns note for note.</li><li>Sketched progressions and edited drum patterns are honoured exactly.</li><li>Chords edited on the cards keep their degree, bar length, seventh and inversion, still fill 8 bars, and survive a track code.</li><li>Edited and recorded lead notes come back verbatim, follow the section key shift and stay in scale.</li><li>Notes drawn into the arp and bass lanes do the same, and the bass stays inside MIDI 36–59.</li><li>A letter key recorded into the arp or the bass keeps its pitch class, lands in that layer\'s own register and stays diatonic to the chord scale.</li><li>Every chord-box pad in every key is entirely in scale.</li><li>A section filter sweep starts and ends on an audible frequency, stays inside its own section and always hands the next one a wide-open mix.</li><li>A section fade moves between silence and full level in one direction, stays inside its own section, never reaches a gain of 0, and leaves every unfaded section at full level.</li><li>Analog drift wanders a voice by cents and never a semitone: a drifted note still rounds to the note that was played, in every key and scale, and its filter never closes.</li><li>The stereo chorus reaches both sides of the field, keeps its delay lines inside their buffer, and bends a note by a few cents at most, so a chorused note is still the note that was played.</li><li>Master warmth lifts the quiet half of a mix and rounds its peaks without ever passing full scale, folding the waveform or boosting the top end, and warmth at 0 is a true bypass.</li></ul>';
document.body.appendChild(h);
}
if(document.body)report();else document.addEventListener('DOMContentLoaded',report);
})();
</script>
